
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPD LIVE Adresse Scanner CH</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;font-family:Arial,sans-serif;background:#eef2f6;color:#243246}
.container{max-width:620px;margin:auto;background:white;padding:16px;border-radius:14px}
h2{color:#d71930;margin-top:0}
.hint{font-size:14px;color:#526477}
.cameraBox{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#111}
video{display:block;width:100%;height:auto;max-height:65vh;object-fit:contain}
.scanFrame{position:absolute;left:5%;top:20%;width:90%;height:60%;border:3px solid #ff304b;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.20);pointer-events:none}
.frameLabel{position:absolute;left:5%;top:13%;background:#d71930;color:white;padding:5px 9px;border-radius:6px;font-size:13px}
label{display:block;margin-top:12px;font-weight:bold}
input{width:100%;padding:12px;font-size:16px;border:1px solid #cbd5e1;border-radius:8px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:8px;font-size:16px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.primary{background:#d71930;color:white;font-weight:bold}
.dark{background:#243b53;color:white}
.secondary{background:#e3e9ef;color:#243246}
#status{margin-top:14px;padding:10px;background:#f1f4f8;border-radius:8px;font-size:14px;white-space:pre-wrap}
details{margin-top:12px;font-size:13px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4f8;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div class="container">
<h2>📷 DPD LIVE Adresse Scanner 🇨🇭</h2>
<p class="hint">Samsung & iPhone – Schweizer Adressen</p>

<div class="cameraBox">
  <video id="video" autoplay playsinline muted></video>
  <div class="scanFrame"></div>
  <div class="frameLabel">Adresse hier positionieren</div>
</div>

<p class="hint">
  Adresse innerhalb des roten Rahmens positionieren.
</p>

<button class="dark" onclick="kameraStarten()">📷 Kamera starten</button>
<button id="scanBtn" class="primary" onclick="adresseScannen()">🔎 Adresse lesen</button>

<canvas id="canvas" style="display:none"></canvas>

<label>Name / Firma</label>
<input id="name" autocomplete="off">

<label>Strasse / Nr.</label>
<input id="strasse" autocomplete="off">

<label>PLZ</label>
<input id="plz" inputmode="numeric" maxlength="4">

<label>Ort</label>
<input id="ort" autocomplete="off">

<button class="primary" onclick="adresseBestaetigen()">
  ✅ Bestätigen – an EPS senden
</button>

<button class="secondary" onclick="adresseKopieren()">
  📋 Adresse kopieren
</button>

<button class="secondary" onclick="felderLeeren()">
  🗑 Felder leeren
</button>

<div id="status">Scanner bereit.</div>

<details>
  <summary>Erkannten OCR-Text anzeigen</summary>
  <pre id="ocrText"></pre>
</details>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
let stream = null;
let busy = false;
let worker = null;

function statusSetzen(text) {
  $("status").textContent = text;
}

function felderLeeren() {
  ["name","strasse","plz","ort"].forEach(id => $(id).value = "");
  $("ocrText").textContent = "";
  statusSetzen("Felder geleert.");
}

function kameraStoppen() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
}

async function kameraStarten() {
  try {
    kameraStoppen();

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Kamera nicht verfügbar. Bitte HTTPS verwenden.");
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });

    $("video").srcObject = stream;
    await $("video").play();
    statusSetzen("Kamera bereit. Adresse im roten Rahmen platzieren.");
  } catch (error) {
    statusSetzen("Kamera-Fehler: " + error.message);
  }
}

function bildAufnehmen() {
  const video = $("video");

  if (!stream || !video.videoWidth || !video.videoHeight) {
    throw new Error("Bitte zuerst Kamera starten.");
  }

  const canvas = $("canvas");
  const ctx = canvas.getContext("2d", {willReadFrequently:true});

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const sx = vw * 0.05;
  const sy = vh * 0.20;
  const sw = vw * 0.90;
  const sh = vh * 0.60;

  const scale = Math.min(2, 2000 / sw);
  canvas.width = Math.round(sw * scale);
  canvas.height = Math.round(sh * scale);

  ctx.drawImage(video,sx,sy,sw,sh,0,0,canvas.width,canvas.height);

  const image = ctx.getImageData(0,0,canvas.width,canvas.height);
  const data = image.data;

  for (let i=0;i<data.length;i+=4) {
    const gray =
      0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];
    const adjusted = Math.max(
      0,Math.min(255,(gray-128)*1.35+128)
    );
    data[i]=adjusted;
    data[i+1]=adjusted;
    data[i+2]=adjusted;
  }

  ctx.putImageData(image,0,0);
  return canvas;
}

function textBereinigen(text) {
  return text
    .replace(/\r/g,"\n")
    .replace(/[|¦]/g," ")
    .replace(/[ \t]+/g," ")
    .split("\n")
    .map(s=>s.trim())
    .filter(Boolean);
}

function adresseAnalysieren(text) {
  const zeilen = textBereinigen(text);
  const result = {name:"",strasse:"",plz:"",ort:""};

  const plzRegex =
    /(?:^|\s)(?:CH[\s-]*)?([1-9]\d{3})\s+([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\s.'-]*)/i;

  const streetRegex =
    /(strasse|straße|str\.?|weg|gasse|platz|allee|ring|rain|steig|hof|quai|rue|route|chemin|avenue|boulevard|via|viale|vicolo|piazza|contrada|impasse)/i;

  const ignorieren =
    /^(dpd|paket|parcel|barcode|tracking|sendung|gewicht|weight|service|express|reference|referenz|tel\.?|phone|www\.|http)/i;

  let plzIndex=-1;
  let strasseIndex=-1;

  for(let i=0;i<zeilen.length;i++){
    const match=zeilen[i].match(plzRegex);
    if(match){
      result.plz=match[1];
      result.ort=match[2].trim();
      plzIndex=i;
      break;
    }
  }

  const ende=plzIndex>=0?plzIndex:zeilen.length;
  const start=plzIndex>=0?Math.max(0,plzIndex-6):0;

  for(let i=ende-1;i>=start;i--){
    const zeile=zeilen[i];
    if(ignorieren.test(zeile))continue;

    const hatHausnummer=/\b\d{1,4}\s*[a-z]?\b/i.test(zeile);

    if(streetRegex.test(zeile)||hatHausnummer){
      result.strasse=zeile;
      strasseIndex=i;
      break;
    }
  }

  if(strasseIndex>0){
    result.name=zeilen
      .slice(Math.max(0,strasseIndex-2),strasseIndex)
      .filter(s=>!ignorieren.test(s)&&!/\b\d{8,}\b/.test(s))
      .join(" ");
  }else if(plzIndex>0){
    const kandidaten=zeilen
      .slice(Math.max(0,plzIndex-3),plzIndex)
      .filter(s=>!ignorieren.test(s));
    result.name=kandidaten[0]||"";
  }

  return result;
}

async function ocrWorkerHolen(){
  if(!worker){
    worker=await Tesseract.createWorker("deu+fra+ita",1);
  }
  return worker;
}

async function adresseScannen(){
  if(busy)return;
  busy=true;
  $("scanBtn").disabled=true;

  try{
    statusSetzen("Adresse wird gelesen... Bitte warten.");
    const canvas=bildAufnehmen();
    const ocr=await ocrWorkerHolen();
    const response=await ocr.recognize(canvas);
    const text=response.data.text||"";

    $("ocrText").textContent=text;

    if(!text.trim()){
      throw new Error("Kein Text erkannt. Bitte erneut versuchen.");
    }

    const adresse=adresseAnalysieren(text);

    $("name").value=adresse.name;
    $("strasse").value=adresse.strasse;
    $("plz").value=adresse.plz;
    $("ort").value=adresse.ort;

    statusSetzen("Adresse erkannt. Bitte alle Felder kontrollieren.");
  }catch(error){
    statusSetzen("OCR-Fehler: "+error.message);
  }finally{
    busy=false;
    $("scanBtn").disabled=false;
  }
}

function adresseHolen(){
  return {
    name:$("name").value.trim(),
    strasse:$("strasse").value.trim(),
    plz:$("plz").value.trim(),
    ort:$("ort").value.trim()
  };
}

function adressePruefen(adresse){
  if(!adresse.name){
    statusSetzen("Bitte Name / Firma eingeben.");
    return false;
  }
  if(!adresse.strasse){
    statusSetzen("Bitte Strasse / Nr. eingeben.");
    return false;
  }
  if(!/^[1-9]\d{3}$/.test(adresse.plz)){
    statusSetzen("Bitte Schweizer PLZ mit 4 Ziffern eingeben.");
    return false;
  }
  if(!adresse.ort){
    statusSetzen("Bitte Ort eingeben.");
    return false;
  }
  return true;
}

function adresseBestaetigen(){
  const adresse=adresseHolen();
  if(!adressePruefen(adresse))return;

  if(window.opener && !window.opener.closed){
    try{
      window.opener.postMessage({
        type:"DPD_ADRESSE_SCAN_V1",
        address:adresse
      },"*");

      statusSetzen(
        "Adresse an EPS gesendet. Bitte EPS prüfen."
      );
      kameraStoppen();
      return;
    }catch(error){
      // Fall back to manual copy.
    }
  }

  statusSetzen(
    "EPS-Verbindung fehlt. Die Adresse bleibt hier erhalten. "+
    "Bitte 'Adresse kopieren' verwenden und zum EPS-Tab zurückkehren."
  );
}

async function adresseKopieren(){
  const adresse=adresseHolen();
  const text=[
    adresse.name,
    adresse.strasse,
    adresse.plz+" "+adresse.ort
  ].join("\n");

  try{
    await navigator.clipboard.writeText(text);
    statusSetzen("Adresse kopiert. Bitte zum EPS-Tab zurückkehren.");
  }catch(error){
    statusSetzen("Kopieren fehlgeschlagen. Bitte Felder manuell übernehmen.");
  }
}

window.addEventListener("load",kameraStarten);

window.addEventListener("pagehide",()=>{
  kameraStoppen();
  if(worker){
    worker.terminate();
    worker=null;
  }
});
</script>
</body>
</html>
